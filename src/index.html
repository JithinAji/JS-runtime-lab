<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Runtime Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- add a text area to write code with highlight backdrop -->
    <div class="editor-container">
      <div class="editor-backdrop" aria-hidden="true"></div>
      <textarea placeholder="write code here" spellcheck="false"></textarea>
    </div>

    <!-- controls area -->
    <div class="controls">
      <!-- Run button placed first in DOM to preserve script.js selection -->
      <button type="button" class="btn btn-run" id="run-btn">Run</button>

      <!-- Step navigation controls -->
      <div class="step-controls">
        <button type="button" class="btn btn-nav" id="prev-btn">
          Previous
        </button>
        <button type="button" class="btn btn-nav" id="next-btn">Next</button>
      </div>

      <!-- Execution mode toggle container -->
      <div class="mode-container">
        <span class="mode-label">Execution Mode</span>
        <button
          type="button"
          class="btn btn-toggle"
          id="toggle-btn"
          data-mode="all">
          <span class="toggle-option active">All At Once</span>
          <span class="toggle-option">Step By Step</span>
        </button>
      </div>
      <!-- Call stack visualization -->
      <div class="call-stack-container">
        <span class="call-stack-label">Call Stack</span>
        <div class="call-stack-list" id="call-stack-list">
          <div class="call-stack-frame empty">(empty)</div>
        </div>
      </div>
    </div>

    <!-- add output area -->
    <div class="output"></div>

    <script src="vendor/acorn.js"></script>
    <script src="script.js"></script>
  </body>
</html>
